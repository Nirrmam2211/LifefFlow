{% extends "layout.html" %}

{% block body_class %}bg-gray-100{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8 m-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-red-600">LifeFlow</h1>
            <h2 class="text-xl font-bold text-gray-700 mt-2">Create Your Account</h2>
            <p class="text-gray-500">Join our community of life-savers.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" required
                    class="shadow-sm appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-red-400 focus:shadow-outline"
                    placeholder="Enter your username">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="shadow-sm appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-red-400 focus:shadow-outline"
                    placeholder="Enter a secure password">
            </div>
            <div class="flex items-center justify-between">
                <button
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md w-full focus:outline-none focus:shadow-outline transition duration-150"
                    type="submit">
                    Sign Up
                </button>
            </div>
        </form>
        <p class="text-center text-gray-600 text-sm mt-6">
            Already have an account? <a href="{{ url_for('login') }}" class="text-red-600 font-medium hover:text-red-700">Log In</a>
        </p>
    </div>
</div>
{% endblock %}
