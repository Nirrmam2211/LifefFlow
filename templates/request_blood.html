{% extends "layout.html" %}
{% block title %}Request Blood - LifeFlow{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Request Blood</h2>

        <form method="POST" class="space-y-6">
            <div>
                <label for="blood_group" class="block text-sm font-medium text-gray-700">Blood Group Needed</label>
                <select name="blood_group" id="blood_group" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500">
                    {% for bg in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                    <option value="{{ bg }}">{{ bg }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="units_needed" class="block text-sm font-medium text-gray-700">Units Needed</label>
                <input type="number" name="units_needed" id="units_needed" required min="1"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500">
            </div>

            <div>
                <label for="hospital" class="block text-sm font-medium text-gray-700">Hospital Name and Address</label>
                <textarea name="hospital" id="hospital" rows="3" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500"
                    placeholder="Enter hospital name and complete address"></textarea>
            </div>

            <div>
                <label for="urgency" class="block text-sm font-medium text-gray-700">Urgency Level</label>
                <select name="urgency" id="urgency" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500">
                    <option value="Emergency">Emergency (Need within 24 hours)</option>
                    <option value="Urgent">Urgent (Need within 3 days)</option>
                    <option value="Standard">Standard (Need within a week)</option>
                </select>
            </div>

            <div>
                <label for="contact" class="block text-sm font-medium text-gray-700">Contact Information</label>
                <input type="tel" name="contact" id="contact" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500"
                    placeholder="Enter your phone number">
            </div>

            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('user_dashboard') }}" 
                   class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700">
                    Submit Request
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
