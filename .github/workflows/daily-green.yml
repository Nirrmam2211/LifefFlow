name: Daily Green Commit

on:
  schedule:
    - cron: "35 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: Nirrmam2211
  GIT_AUTHOR_EMAIL: Nirmamdshah@gmail.com
  GIT_COMMITTER_NAME: Nirrmam2211
  GIT_COMMITTER_EMAIL: Nirmamdshah@gmail.com

jobs:
  keep-contributions-active:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update daily activity log
        run: |
          mkdir -p .github/commit-activity
          echo "Commit made on $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> .github/commit-activity/daily-log.txt

      - name: Commit and push changes
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add .github/commit-activity/daily-log.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily contribution update"
          git push
