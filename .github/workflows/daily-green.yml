name: Daily Green Commit

on:
  schedule:
    - cron: "35 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-contributions-active:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update daily activity log
        run: |
          mkdir -p .github/commit-activity
          echo "Commit made on $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> .github/commit-activity/daily-log.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/commit-activity/daily-log.txt
          git commit -m "chore: daily contribution update" || exit 0
          git push
